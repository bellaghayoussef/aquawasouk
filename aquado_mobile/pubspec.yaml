name: aquawasouk
description: A beautiful Flutter e-commerce mobile app for Aquado

publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  carousel_slider: ^5.1.1
  badges: ^3.1.2
  flutter_rating_bar: ^4.0.1
  smooth_page_indicator: ^2.0.1

  # State Management
  provider: ^6.1.1

  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0
  
  # Authentication
  google_sign_in: ^6.2.1

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Image Handling
  image_picker: ^1.0.7

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.2.4
  fluttertoast: ^9.0.0

  # Icons
  font_awesome_flutter: ^10.7.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true # Or true for default name
  ios: true
  image_path: "assets/images/logo.png" # Path to your icon image

flutter:
  uses-material-design: true



    # Optional: specify different icons for platforms
    # image_path_android: "assets/icon/android.png"
    # image_path_ios: "assets/icon/ios.png"
    # adaptive_icon_background: "#ffffff" # Android adaptive icon background
    # adaptive_icon_foreground: "assets/icon/foreground.png" # Android adaptive icon foreground

  assets:
    - assets/images/

